<link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
  <style>
    /* ── DESIGN TOKENS ── */
    :root {
      --bg:          #07050f;
      --bg2:         #0d0b1e;
      --surface:     rgba(255,255,255,0.04);
      --surface2:    rgba(255,255,255,0.08);
      --border:      rgba(255,255,255,0.10);
      --border-hi:   rgba(139,92,246,0.45);
      --primary:     #7c3aed;
      --primary-hi:  #a78bfa;
      --accent:      #06d6a0;
      --accent2:     #f72585;
      --text:        #e2e0f0;
      --text-muted:  #8882a8;
      --yes:         #06d6a0;
      --no:          #f72585;
      --tab-radius:  14px;
      --glass:       blur(18px) saturate(160%);
      --shadow:      0 8px 32px rgba(0,0,0,0.55);
    }
    [data-theme="light"] {
      --bg:          #f0eeff;
      --bg2:         #e4e0fa;
      --surface:     rgba(255,255,255,0.72);
      --surface2:    rgba(255,255,255,0.90);
      --border:      rgba(100,80,200,0.18);
      --border-hi:   rgba(124,58,237,0.4);
      --text:        #1a1535;
      --text-muted:  #6b5fa6;
      --shadow:      0 8px 32px rgba(80,0,200,0.12);
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'SolaimanLipi', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background .4s, color .4s;
    }

    /* ── ANIMATED BACKGROUND ── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: .35;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb-1 { width: 520px; height: 520px; top: -180px; left: -120px;
              background: radial-gradient(circle, #7c3aed, transparent 70%);
              animation-duration: 20s; }
    .orb-2 { width: 400px; height: 400px; top: 50%; right: -100px;
              background: radial-gradient(circle, #06d6a0, transparent 70%);
              animation-duration: 15s; animation-delay: -7s; }
    .orb-3 { width: 350px; height: 350px; bottom: -100px; left: 30%;
              background: radial-gradient(circle, #f72585, transparent 70%);
              animation-duration: 22s; animation-delay: -4s; }
    [data-theme="light"] .orb { opacity: .18; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    /* ── GRID NOISE TEXTURE ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    [data-theme="light"] body::before { background-image: linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 99px; }

    /* ── LAYOUT ── */
    #app { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 0 14px 60px; }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 60px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
      animation: slideDown .6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } }
    .brand-link {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
      font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800;
    }
    .brand-link img { height: 34px; border-radius: 8px; }
    .brand-link span { background: linear-gradient(135deg, var(--primary-hi), var(--accent));
                       -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .btn-icon {
      width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); cursor: pointer;
      display: grid; place-items: center; font-size: .95rem;
      transition: border-color .2s, background .2s, transform .15s;
    }
    .btn-icon:hover { border-color: var(--primary-hi); transform: scale(1.07); }

    /* ── PROFILE CARD ── */
    .profile-card {
      margin: 28px 0 20px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 20px 22px;
      backdrop-filter: var(--glass); -webkit-backdrop-filter: var(--glass);
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
      animation: fadeUp .7s .15s cubic-bezier(.22,1,.36,1) both;
    }
    .profile-left { display: flex; align-items: center; gap: 14px; }
    .profile-avatar {
      width: 58px; height: 58px; border-radius: 16px;
      object-fit: cover; border: 2px solid var(--border-hi);
      box-shadow: 0 0 0 4px rgba(124,58,237,.15);
    }
    .profile-name { font-size: 1rem; font-weight: 700; }
    .profile-sub { font-size: .82rem; color: var(--text-muted); margin-top: 3px; }
    .profile-btns { display: flex; gap: 9px; flex-wrap: wrap; }
    .pill-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 15px; border-radius: 10px; font-size: .82rem; font-weight: 600;
      text-decoration: none; border: none; cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .pill-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .pill-yt  { background: linear-gradient(135deg, #ff0000, #cc0000); color: #fff; }
    .pill-tg  { background: linear-gradient(135deg, #229ed9, #0088cc); color: #fff; }

    /* ── LATEST UPDATES ── */
    .section-label {
      font-size: .78rem; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 10px;
      animation: fadeUp .6s .25s both;
    }
    .video-slider {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;
      scrollbar-width: thin;
      animation: fadeUp .6s .3s both;
    }
    .video-card {
      flex: 0 0 160px; border-radius: 12px; overflow: hidden;
      background: var(--surface2); border: 1px solid var(--border);
      text-decoration: none; color: var(--text); cursor: pointer;
      transition: transform .2s, border-color .2s;
    }
    .video-card:hover { transform: translateY(-4px); border-color: var(--primary-hi); }
    .video-card img { width: 100%; height: 90px; object-fit: cover; display: block; }
    .video-card-title { font-size: .75rem; padding: 7px 9px; line-height: 1.3; }

    /* ── TABS ── */
    .tabs-wrapper { margin-top: 26px; animation: fadeUp .6s .38s both; }
    .tab-nav {
      display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto;
      padding-bottom: 2px; scrollbar-width: none;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1 0 auto; min-width: 0;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 14px; border-radius: var(--tab-radius);
      font-family: 'SolaimanLipi', sans-serif; font-size: .68rem; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-muted);
      transition: all .25s cubic-bezier(.22,1,.36,1);
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); border-color: var(--border-hi); }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary) 0%, #5b21b6 100%);
      border-color: transparent; color: #fff;
      box-shadow: 0 4px 20px rgba(124,58,237,.45);
    }
    .tab-btn i { font-size: .9em; }

    /* ── TAB CONTENT ── */
    .tab-panel { display: none; animation: panelIn .4s cubic-bezier(.22,1,.36,1) both; }
    .tab-panel.active { display: block; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(12px); } }

    /* ── ALERT ── */
    .alert {
      display: flex; align-items: flex-start; gap: 10px;
      margin: 18px 0 14px;
      padding: 12px 16px; border-radius: 12px;
      background: rgba(247,37,133,.08); border: 1px solid rgba(247,37,133,.22);
      font-size: .82rem; color: var(--text-muted); line-height: 1.5;
    }
    .alert i { color: var(--accent2); margin-top: 2px; flex-shrink: 0; }

    /* ── TABLE WRAPPER ── */
    .table-wrap {
      width: 100%; overflow-x: auto;
      border-radius: 16px; border: 1px solid var(--border);
      background: var(--surface); backdrop-filter: var(--glass);
      -webkit-backdrop-filter: var(--glass);
    }
    table {
      width: 100%; border-collapse: collapse;
      table-layout: fixed;
      font-size: .84rem;
      
    }
    thead tr {
      background: linear-gradient(90deg, rgba(124,58,237,.22), rgba(6,214,160,.08));
      border-bottom: 1px solid var(--border);
      
    }
    th {
      padding: 11px 12px; text-align: left; font-weight: 700;
      color: var(--primary-hi); white-space: nowrap;
      font-size: .8rem; letter-spacing: .03em
      
    }
    td {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      color: var(--text); vertical-align: middle;
      word-break: break-word;
    }
    tbody tr { transition: background .15s; }
    tbody tr:hover { background: var(--surface2); }
    tbody tr:last-child td { border-bottom: none; }

    /* per-tab column widths */
    .tbl-application th:nth-child(1), .tbl-application td:nth-child(1) { width: 25%; }
    .tbl-application th:nth-child(2), .tbl-application td:nth-child(2) { width: 25%; }
    .tbl-application th:nth-child(3), .tbl-application td:nth-child(3) { width: 30%; }
    .tbl-application th:nth-child(4), .tbl-application td:nth-child(4) { width: 25%; }

    .tbl-exam th:nth-child(1), .tbl-exam td:nth-child(1) { width: 30%; }
    .tbl-exam th:nth-child(2), .tbl-exam td:nth-child(2) { width: 28%; }
    .tbl-exam th:nth-child(3), .tbl-exam td:nth-child(3) { width: 30%; }
    .tbl-exam th:nth-child(4), .tbl-exam td:nth-child(4) { width: 27%; }

    .tbl-info th:nth-child(1), .tbl-info td:nth-child(1) { width: 22%; }
    .tbl-info th:nth-child(2), .tbl-info td:nth-child(2) { width: 18%; }
    .tbl-info th:nth-child(3), .tbl-info td:nth-child(3) { width: 20%; text-align: center; }
    .tbl-info th:nth-child(4), .tbl-info td:nth-child(4) { width: 22%; text-align: center; }
    .tbl-info th:nth-child(5), .tbl-info td:nth-child(5) { width: 18%; }

    .tbl-result th:nth-child(1), .tbl-result td:nth-child(1) { width: 38%; }
    .tbl-result th:nth-child(2), .tbl-result td:nth-child(2) { width: 34%; }
    .tbl-result th:nth-child(3), .tbl-result td:nth-child(3) { width: 28%; }

    /* ── BADGE LINK ── */
    .badge-link {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 8px; font-size: .78rem; font-weight: 600;
      text-decoration: none;
      background: linear-gradient(135deg, var(--primary), #5b21b6);
      color: #fff; transition: transform .15s, box-shadow .15s;
      white-space: nowrap;
    }
    .badge-link:hover { transform: scale(1.05); box-shadow: 0 3px 12px rgba(124,58,237,.4); }
    .badge-link.result { background: linear-gradient(135deg, var(--accent), #029973); }

    /* ── COUNTDOWN ── */
    .countdown {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: .70rem; font-weight: 700;
      white-space: nowrap; border-radius: 7px;
      padding: 2px 7px;
      transition: background .3s, color .3s;
    }
    .countdown.expired {
      color: var(--no);
      background: rgba(247,37,133,.10);
    }
    .countdown.soon {
      color: #f59e0b;
      background: rgba(245,158,11,.10);
    }
    .countdown.ok {
      color: var(--yes);
      background: rgba(6,214,160,.10);
    }
    /* ২ ঘণ্টার কম বাকি — পালসিং ওয়ার্নিং */
    .countdown.critical {
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 10px rgba(239,68,68,.5), 0 0 20px rgba(239,68,68,.2);
      animation: criticalPulse 1.1s ease-in-out infinite;
      padding: 3px 9px;
    }
    .countdown.critical::before {
      content: '⚠';
      font-size: .75em;
      opacity: .9;
    }
    @keyframes criticalPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(239,68,68,.5), 0 0 18px rgba(239,68,68,.2); transform: scale(1); }
      50%       { box-shadow: 0 0 16px rgba(239,68,68,.8), 0 0 30px rgba(239,68,68,.4); transform: scale(1.04); }
    }

    /* ── ICONS YES/NO ── */
    .icon-yes { color: var(--yes); font-size: 1rem; }
    .icon-no  { color: var(--no);  font-size: 1rem; }

    /* ── SKELETON LOADER ── */
    .skeleton-row td { background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%); background-size: 400% 100%; animation: shimmer 1.6s infinite; border-radius: 6px; height: 36px; }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

    /* ── FOOTER ── */
    footer {
      position: relative; z-index: 1; text-align: center;
      padding: 24px 16px; font-size: .82rem; color: var(--text-muted);
      border-top: 1px solid var(--border); margin-top: 40px;
    }
    footer a { color: var(--primary-hi); font-weight: 700; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── FADE UP UTILITY ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 500px) {
      .brand-link span { display: none; }
      .profile-card { padding: 14px 16px; }
      .pill-btn { padding: 6px 12px; font-size: .78rem; }
      table { font-size: .78rem; }
      th, td { padding: 8px 8px; }
      .badge-link { padding: 3px 7px; font-size: .73rem; }
    }
    @import url('https://fonts.maateen.me/solaiman-lipi/font.css');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'SolaimanLipi', sans-serif;
      overflow: hidden;
      background: #f5f5f5;
    }

    /* Blurred background */
    .blur-bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(135deg, #dbeafe, #fce7f3, #dcfce7);
      filter: blur(12px);
      transform: scale(1.08);
      z-index: -2;
    }

    /* Blur + dark overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      z-index: -1;
    }

    /* Center container */
    .popup-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .popup {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 35px 25px;
      border-radius: 24px;

      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.7);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.25),
        0 8px 25px rgba(0, 0, 0, 0.12);

      animation: popupIn 0.6s ease;
    }

    .popup-icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 30px;

      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    }

    .popup-text {
      color: #111827;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .admission-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 14px 28px;
      border-radius: 50px;

      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;

      text-decoration: none;
      font-size: 18px;
      font-weight: 700;

      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);

      transition: all 0.3s ease;
    }

    .admission-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 30px rgba(37, 99, 235, 0.45);
    }

    .admission-btn:active {
      transform: scale(0.97);
    }

    .arrow {
      font-family: Arial, sans-serif;
      font-size: 20px;
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.94);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .popup {
        padding: 30px 18px;
        border-radius: 20px;
      }

      .popup-text {
        font-size: 20px;
      }

      .admission-btn {
        width: 100%;
        font-size: 17px;
        padding: 14px 20px;
      }
    }
  </style>
</head>

<!-- Header

<script>
/* ── THEME TOGGLE ── */
const html  = document.documentElement;
const icon  = document.getElementById('themeIcon');
let theme   = localStorage.getItem('theme') || 'dark';
applyTheme(theme);
document.getElementById('themeToggle').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme(theme);
  localStorage.setItem('theme', theme);
});
function applyTheme(t) {
  html.setAttribute('data-theme', t);
  icon.className = t === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}

/* ── FOOTER YEAR ── */
document.getElementById('year').textContent = new Date().getFullYear();

/* ── TABS ── */
const tabBtns   = document.querySelectorAll('.tab-btn');
const tabPanels = document.querySelectorAll('.tab-panel');
tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.tab;
    tabBtns.forEach(b => b.classList.remove('active'));
    tabPanels.forEach(p => { p.classList.remove('active'); });
    btn.classList.add('active');
    const panel = document.getElementById('panel-' + target);
    panel.classList.add('active');
    // re-trigger animation
    panel.style.animation = 'none';
    panel.offsetHeight;
    panel.style.animation = '';
  });
});

/* ── COUNTDOWN HELPER ── */
function parseCountdown(str) {
  // format: "DD-MM-YYYY HH:MM"
  const [datePart, timePart] = str.trim().split(' ');
  const [d, m, y] = datePart.split('-').map(Number);
  const [h, mn]   = (timePart || '23:59').split(':').map(Number);
  return new Date(y, m - 1, d, h, mn, 0);
}

// ইংরেজি সংখ্যাকে বাংলায় রূপান্তর
function toBn(n) {
  return String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
}

function formatCountdown(target) {
  const diff = target - Date.now();
  if (diff <= 0) return { text: 'সময় শেষ', cls: 'expired' };

  const totalMins = Math.floor(diff / 60000);
  const totalHrs  = Math.floor(diff / 3600000);
  const days      = Math.floor(diff / 86400000);
  const hours     = Math.floor((diff % 86400000) / 3600000);
  const mins      = Math.floor((diff % 3600000)  / 60000);

  // ২ ঘণ্টার কম বাকি — critical
  if (totalHrs < 2) {
    const text = totalMins < 60
      ? `${toBn(totalMins)}মিঃ`
      : `${toBn(hours)}ঘঃ ${toBn(mins)}মিঃ`;
    return { text, cls: 'critical' };
  }

  // ৩ দিনের কম — সতর্কতা
  if (days < 3) {
    const text = days > 0
      ? `${toBn(days)}দিন ${toBn(hours)}ঘঃ`
      : `${toBn(hours)}ঘঃ ${toBn(mins)}মিঃ`;
    return { text, cls: 'soon' };
  }

  // সাধারণ
  const text = `${toBn(days)}দিন ${toBn(hours)}ঘঃ`;
  return { text, cls: 'ok' };
}
const countdownEls = [];
function registerCountdown(el, str) {
  const target = parseCountdown(str);
  countdownEls.push({ el, target });
  updateOne(el, target);
}
function updateOne(el, target) {
  const { text, cls } = formatCountdown(target);
  el.textContent = text;
  el.className = `countdown ${cls}`;
}
setInterval(() => countdownEls.forEach(({ el, target }) => updateOne(el, target)), 60000);

/* ── BUILD TABLE ROWS ── */
function buildApplication(rows) {
  return rows.map(r => {
    const cdEl = `<span class="countdown" data-cd="${r.countdown}"></span>`;
    const link = r.link && r.link !== '#'
      ? `<a href="${r.link}" target="_blank" class="badge-link">${r.linkText} <i class="fa-solid fa-arrow-up-right-from-square"></i></a>`
      : `<span style="color:var(--text-muted)">${r.linkText || '—'}</span>`;
    return `<tr><td>${r.university}</td><td>${link}</td><td>${r.deadline}</td><td>${cdEl}</td></tr>`;
  }).join('');
}
function buildExam(rows) {
  return rows.map(r => {
    const cdEl = `<span class="countdown" data-cd="${r.countdown}"></span>`;
    return `<tr><td>${r.university}</td><td>${r.admitCard}</td><td>${r.date}</td><td>${cdEl}</td></tr>`;
  }).join('');
}
function buildInfo(rows) {
  return rows.map(r => {
    const yes = `<i class="fa-solid fa-circle-check icon-yes"></i>`;
    const no  = `<i class="fa-solid fa-circle-xmark icon-no"></i>`;
    const circ = r.circularLink && r.circularLink !== '#'
      ? `<a href="${r.circularLink}" target="_blank" class="badge-link">দেখুন</a>`
      : `<a href="${r.circularLink}" class="badge-link">দেখুন</a>`;
    return `<tr><td>${r.university}</td><td>${r.negative}</td><td>${r.calculator ? yes : no}</td><td>${r.secondTime ? yes : no}</td><td>${circ}</td></tr>`;
  }).join('');
}
function buildResult(rows) {
  return rows.map(r => {
    const link = r.link && r.link !== '#'
      ? `<a href="${r.link}" target="_blank" class="badge-link result">দেখুন <i class="fa-solid fa-eye"></i></a>`
      : `<span style="color:var(--text-muted)">—</span>`;
    return `<tr><td>${r.university}</td><td>${r.date}</td><td>${link}</td></tr>`;
  }).join('');
}
function buildVideos(videos) {
  const slider = document.getElementById('videoSlider');
  slider.innerHTML = videos.map((v, i) => `
    <a href="${v.url}" target="_blank" class="video-card" style="animation:fadeUp .5s ${.3 + i*.08}s both">
      <img src="${v.thumb}" alt="${v.title}" loading="lazy">
      <div class="video-card-title">${v.title}</div>
    </a>`).join('');
}

/* ── LOAD DATA ── */
fetch('https://admc.maahin.my.id/data.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('body-application').innerHTML = buildApplication(data.application);
    document.getElementById('body-exam').innerHTML        = buildExam(data.exam);
    document.getElementById('body-info').innerHTML        = buildInfo(data.info);
    document.getElementById('body-result').innerHTML      = buildResult(data.result);
    if (data.videos && data.videos.length) buildVideos(data.videos);

    // register countdowns
    document.querySelectorAll('[data-cd]').forEach(el => {
      registerCountdown(el, el.dataset.cd);
    });

    // row stagger animation
    document.querySelectorAll('tbody tr').forEach((tr, i) => {
      tr.style.animation = `fadeUp .4s ${i * .025}s both`;
    });
  })
  .catch(err => {
    console.error('Failed to load data.json:', err);
    ['application','exam','info','result'].forEach(id => {
      const el = document.getElementById('body-' + id);
      if (el) el.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--accent2);padding:20px;">
        ডেটা লোড হয়নি। <code>data.json</code> ফাইলটি index.html এর পাশে রাখুন।</td></tr>`;
    });
  });
</script>
